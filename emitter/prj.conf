CONFIG_NEWLIB_LIBC=y

# --- Stack and Heap ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# --- Bluetooth Low Energy ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME="LT-E-0000"
CONFIG_BT_MAX_CONN=3

# --- ATT MTU ---
# The phone's CMD_BROADCAST_GAME_CFG payload (game header + teams + roster +
# emitter config + boundary) is ~45-200 bytes. The default 23-byte ATT MTU caps
# a single write at 20 bytes, which would force iOS into an ATT Long Write that
# this server rejects (CONFIG_BT_ATT_PREPARE_COUNT defaults to 0), so the write
# silently fails and the game never starts. Bump the MTU so the whole config
# lands in one write. DLE max lets it travel without LL fragmentation.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# --- Hardware Drivers ---
CONFIG_GPIO=y
CONFIG_PWM=y

# --- Settings Subsystem (NVS) ---
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# --- Coded PHY & Extended Adv ---
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=3
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_PHY_CODED=y
CONFIG_BT_USER_PHY_UPDATE=y

# --- TX Power (max for mesh range) ---
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Entropy for random numbers ---
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=n
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
